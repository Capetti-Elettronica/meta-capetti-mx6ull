# SUMMARY = "Custom config file for hostapd"
# DESCRIPTION = "This config file sets access policies for Wi-Fi access point"

interface=wlan0
driver=nl80211
ssid=capetti-gateway
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=capettipwd
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP